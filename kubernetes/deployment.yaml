apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native-app
  namespace: cloud-native
  labels:
    app.kubernetes.io/name: cloud-native-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-native-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-native-app
    spec:
      containers:
        - name: web
          image: asia-south1-docker.pkg.dev/gcp-cloud-native-509022/cloud-native-app/web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cloud-native-app-config
            - secretRef:
                name: cloud-native-app-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
